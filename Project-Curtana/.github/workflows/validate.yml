name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  repository-contract:
    name: Repository contract
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\automation"
          python -m unittest discover -s tests -p "test_*.py"

      - name: Check batch help output
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path scripts -Recurse -Filter *.bat
          foreach ($script in $scripts) {
            Write-Host "Checking $($script.FullName)"
            cmd /c "`"$($script.FullName)`" --help"
            if ($LASTEXITCODE -ne 0) {
              throw "Help command failed for $($script.FullName)"
            }
          }

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !LICENSE

